[project]
name = "nc3-testing-platform"
version = "0.1.0"
description = "v4.0 backend MVP for the NC3 Testing Platform."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.6.3",
    "fastapi[standard]>=0.139.2",
    "idna>=3.18",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.13.4",
]

[project.scripts]
export-openapi = "nc3_testing_platform.tools.export_openapi:main"

[dependency-groups]
dev = [
    "defusedxml>=0.7.1",
    "httpx2>=2.9.1",
    "jsonschema>=4.26.0",
    "openapi-spec-validator>=0.9.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D", "ERA", "TD"]
ignore = ["D105", "D107", "TD002", "TD003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]

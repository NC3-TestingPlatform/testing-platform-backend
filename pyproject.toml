[project]
name = "nc3-testing-platform"
version = "0.1.0"
description = "v4.0 backend MVP for the NC3 Testing Platform."
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "alembic>=1.19.1",
    "celery[gevent,redis]>=5.6.3",
    "fastapi[standard]>=0.141.1",
    "idna>=3.18",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15",
    "pydantic[email]>=2.13.4",
    "python-dateutil>=2.9.0.post0",
    "redis>=5",
    "sqlalchemy>=2.0",
    "tzdata>=2026.3",
    "uuid6>=2025.0.1",
]

[project.scripts]
export-openapi = "nc3_testing_platform.tools.export_openapi:main"

# Scan modules register here and are discovered by modules/registry.py;
# nothing imports them by name (US #76, IDR-007). External module packages
# add their own entry to this group in their own pyproject.toml.
[project.entry-points."nc3_testing_platform.modules"]
noop = "nc3_testing_platform.modules.noop:MODULE"
dnssec = "nc3_testing_platform.modules.dnssec:MODULE"
pqc = "nc3_testing_platform.modules.pqc:MODULE"

# Engines are external packages the worker images provision (B1); they are
# not needed to install the platform, run the default test suite, or discover
# a module's descriptor — only to actually execute a scan. Pin to a tag.
[project.optional-dependencies]
modules = [
    "chainvalidator @ git+https://github.com/NC3-TestingPlatform/chainvalidator.git@v0.1.6",
    "quantumvalidator @ git+https://github.com/NC3-TestingPlatform/quantumvalidator.git@v0.7.1",
]

[dependency-groups]
dev = [
    "defusedxml>=0.7.1",
    "fakeredis>=2.26",
    "httpx2>=2.10.0",
    "jsonschema>=4.26.0",
    "openapi-spec-validator>=0.9.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.2",
    "types-python-dateutil>=2.9.0.20260807",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D", "ERA", "TD"]
ignore = ["D105", "D107", "TD002", "TD003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "redis: needs a real Redis at REDIS_URL (deselected by default; CI runs it against a service container)",
    "postgres: needs a live PostgreSQL at DATABASE_URL with the migrations and runtime roles applied (deselected by default; CI runs it in the Migration round trip job)",
]
# The default run needs no services; `pytest -m redis` / `-m postgres`
# (a later -m wins) opts in.
addopts = '-m "not redis and not postgres"'

# Coverage is deliberately *not* in `addopts`: the default run stays fast and
# service-free, and the gate is a separate CI step (US #77 task #206). It is
# scoped to the normalization layer because that package is small, pure, and
# the single owner of engine→platform mapping (IDR-018) — the rest of the
# backend is nowhere near 100 % and a repo-wide gate would red every build.
[tool.coverage.run]
branch = true
source = ["nc3_testing_platform.modules.normalization"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.pyright]
include = ["src", "tests"]

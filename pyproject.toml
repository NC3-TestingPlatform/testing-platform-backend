[project]
name = "testing-platform-backend"
version = "0.1.0"
description = "v4.0 backend MVP for the NC3 Testing Platform."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.139.2",
    "pydantic[email]>=2.13.4",
]

[dependency-groups]
dev = [
    "openapi-spec-validator>=0.9.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

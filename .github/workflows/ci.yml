name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check .

      - name: Type check
        run: uv run --locked pyright

      - name: Test
        run: uv run --locked pytest

  migrations:
    name: Migration round trip
    runs-on: ubuntu-latest
    services:
      postgres:
        # Digest-pinned so the migration gate is reproducible; matches the tag
        # the compose stack runs.
        image: postgres:18.4-trixie@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Build the schema from empty
        run: uv run --locked alembic upgrade head

      - name: Fail when models and head disagree
        run: uv run --locked alembic check

      - name: Round trip back to empty and up again
        run: |
          uv run --locked alembic downgrade base
          uv run --locked alembic upgrade head

  # Taiga #160: the stack must come up from a clean checkout, gated on the
  # containers' own healthchecks (--wait fails the step if any goes unhealthy),
  # and prove one job round-trips broker -> workers -> PostgreSQL.
  compose-smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and start the stack, gated on healthchecks
        run: docker compose up -d --build --wait

      - name: API liveness answers from the host
        run: curl -sSf http://127.0.0.1:8000/healthz

      # Taiga #158: the proxy is the browser-facing entry; both checks go
      # through it. The SSE check proves pass-through is not buffered into
      # uselessness — the stream must announce itself as an event stream and
      # deliver bytes before --max-time expires.
      - name: API liveness answers through the reverse proxy
        run: curl -sSf http://127.0.0.1:8888/healthz

      - name: SSE streams through the reverse proxy
        run: |
          # The id is the live mock's stable sample job (scans/examples.py);
          # the path validates as UUIDv7, so a nil UUID would 422.
          headers=$(curl -sSfN --max-time 5 -D - -o /dev/null \
            "http://127.0.0.1:8888/api/v1/scans/019ee1a0-3b91-7c05-8f41-6d2a90bb17c4/events")
          if ! printf '%s' "$headers" | grep -qi '^content-type: text/event-stream'; then
            echo "::error::expected text/event-stream through the proxy" >&2
            printf '%s\n' "$headers"
            exit 1
          fi

      - name: Scan round trip lands in PostgreSQL
        run: |
          make scan DOMAIN=ci-smoke.example
          for attempt in $(seq 1 30); do
            count=$(docker compose exec -T postgres psql -U postgres -d nc3_testing_platform \
              -tAc "SELECT count(*) FROM scan_artifacts WHERE domain = 'ci-smoke.example'" 2>/dev/null || echo 0)
            if [ "${count:-0}" -ge 1 ]; then
              echo "artifact persisted after ${attempt} polls"
              exit 0
            fi
            sleep 2
          done
          echo "::error::no scan artifact appeared within 60s" >&2
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 150

      - name: Tear down
        if: always()
        run: docker compose down -v

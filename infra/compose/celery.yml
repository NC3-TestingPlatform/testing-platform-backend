# One worker class per egress profile, each consuming exactly one queue.
# Queue names are fixed by the egress-segregated task queues decision; a module never selects its own queue.
#
# Compose expresses only the coarsest of the four egress profiles: an internal network blocks all outbound traffic, but "public internet with RFC1918 blocked" and "SMTP relay and org webhooks only" need firewall rules the container runtime does not model.
# The network layer remains the authoritative SSRF control, so these definitions are not the enforcement boundary.
#
# Each queue builds its own image from its own Dockerfile stage (US #78 ADR: per-egress-queue images, not one monolithic all-engines venv).
# Distinct targets get distinct tags, so concurrent builds do not race on one tag, and rebuilding one queue's image cannot leave another on stale code.
#
# Pools follow IDR-004 / the egress-queues ADR (which supersede the earlier US #78
# Taiga text): gevent for the IO-bound scan queues — their per-engine timeouts are
# enforced at the subprocess boundary by the module runner, not by Celery time
# limits, which gevent does not support — and prefork for file-analysis and
# platform, where the time limits and max-tasks-per-child recycling in
# worker/app.py do bite.
#
# The `x-worker` anchor resolves only within this file; cross-file reuse goes through `extends`.
x-worker: &worker
  extends:
    file: common.yml
    service: defaults
  environment: &worker-env
    CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-rabbitmq}:${RABBITMQ_PASSWORD:-rabbitmq}@rabbitmq:5672//
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nc3_testing_platform}
    # Runtime role connection (docs/database-roles.md): what worker/db.py
    # connects with since B5. This anchor carries the tenant role `nc3_app`
    # for the scan queues; worker-platform and beat override it below with the
    # `app_platform` duty role (IDR-012 — role separation is fixed per
    # service, never selected in code).
    # The password is interpolated raw: if it contains URL-reserved characters
    # (@ : / % ? #), set APP_DATABASE_URL directly with it percent-encoded.
    APP_DATABASE_URL: ${APP_DATABASE_URL:-postgresql+psycopg://nc3_app:${NC3_APP_DB_PASSWORD:-nc3_app}@postgres:5432/${POSTGRES_DB:-nc3_testing_platform}}
    REDIS_URL: redis://redis:6379/0
    CELERY_MAX_TASKS_PER_CHILD: ${CELERY_MAX_TASKS_PER_CHILD:-100}
    SCAN_TASK_TIMEOUT_SECONDS: ${SCAN_TASK_TIMEOUT_SECONDS:-120}
    SCAN_JOB_TIMEOUT_SECONDS: ${SCAN_JOB_TIMEOUT_SECONDS:-900}
    SCAN_HEARTBEAT_INTERVAL_SECONDS: ${SCAN_HEARTBEAT_INTERVAL_SECONDS:-5}
    SCAN_STALE_AFTER_SECONDS: ${SCAN_STALE_AFTER_SECONDS:-30}
    SCAN_SWEEP_INTERVAL_SECONDS: ${SCAN_SWEEP_INTERVAL_SECONDS:-15}
  depends_on:
    rabbitmq:
      condition: service_healthy
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  # Longer than the worst-case task lifetime — the hard time limit is
  # SCAN_TASK_TIMEOUT_SECONDS + 30 (worker/app.py), 150s by default — so an
  # in-flight task is killed by Celery and its partial results written before
  # the runtime sends SIGKILL. Raising the task timeout past ~150s means
  # raising this too.
  stop_grace_period: 180s

# A worker that starts but cannot serve is caught two ways: worker/app.py's
# preflight exits the container at startup when the image lacks its queue's
# binaries, and the ping below marks it unhealthy when the worker stops
# answering its own control queue. Every ping pays a broker round trip, so the
# interval stays wide.
x-worker-healthcheck: &worker-healthcheck
  interval: 30s
  timeout: 15s
  retries: 3
  start_period: 60s

services:
  worker-non-intrusive-scan:
    <<: *worker
    image: nc3-testing-platform-worker-non-intrusive-scan:local
    build:
      context: ../..
      target: worker-non-intrusive-scan
    command:
      - celery
      - -A
      - nc3_testing_platform.worker.app
      - worker
      - --queues=non-intrusive-scan
      - --pool=gevent
      - --concurrency=${CELERY_GEVENT_CONCURRENCY:-100}
      - --hostname=non-intrusive-scan@%h
    healthcheck:
      test: ["CMD-SHELL", "celery -A nc3_testing_platform.worker.app inspect ping -d non-intrusive-scan@$$HOSTNAME --timeout 10"]
      <<: *worker-healthcheck

  worker-intrusive-scan:
    <<: *worker
    image: nc3-testing-platform-worker-intrusive-scan:local
    build:
      context: ../..
      target: worker-intrusive-scan
    command:
      - celery
      - -A
      - nc3_testing_platform.worker.app
      - worker
      - --queues=intrusive-scan
      - --pool=gevent
      - --concurrency=${CELERY_GEVENT_CONCURRENCY:-100}
      - --hostname=intrusive-scan@%h
    healthcheck:
      test: ["CMD-SHELL", "celery -A nc3_testing_platform.worker.app inspect ping -d intrusive-scan@$$HOSTNAME --timeout 10"]
      <<: *worker-healthcheck

  worker-file-analysis:
    <<: *worker
    image: nc3-testing-platform-worker-file-analysis:local
    build:
      context: ../..
      target: worker-file-analysis
    # Prefork also gives each hostile file its own process to escape from.
    command:
      - celery
      - -A
      - nc3_testing_platform.worker.app
      - worker
      - --queues=file-analysis
      - --pool=prefork
      - --concurrency=${CELERY_PREFORK_CONCURRENCY:-4}
      - --hostname=file-analysis@%h
    healthcheck:
      test: ["CMD-SHELL", "celery -A nc3_testing_platform.worker.app inspect ping -d file-analysis@$$HOSTNAME --timeout 10"]
      <<: *worker-healthcheck

  worker-platform:
    <<: *worker
    image: nc3-testing-platform-worker-platform:local
    build:
      context: ../..
      target: worker-platform
    environment:
      <<: *worker-env
      # The platform queue's duties (dispatch, reaper, heartbeat, seed tool)
      # are cross-organization by nature: they run as `app_platform`, whose
      # per-duty allowlist policies replace the tenant GUC arms (IDR-012).
      APP_DATABASE_URL: ${PLATFORM_DATABASE_URL:-postgresql+psycopg://app_platform:${NC3_PLATFORM_DB_PASSWORD:-app_platform}@postgres:5432/${POSTGRES_DB:-nc3_testing_platform}}
    command:
      - celery
      - -A
      - nc3_testing_platform.worker.app
      - worker
      - --queues=platform
      - --pool=prefork
      - --concurrency=${CELERY_PREFORK_CONCURRENCY:-4}
      - --hostname=platform@%h
    healthcheck:
      test: ["CMD-SHELL", "celery -A nc3_testing_platform.worker.app inspect ping -d platform@$$HOSTNAME --timeout 10"]
      <<: *worker-healthcheck

  beat:
    <<: *worker
    # The reaper and heartbeat sweeps (worker/app.py beat_schedule, B8): the
    # reaper re-publishes stranded jobs and fails jobs stuck past
    # SCAN_JOB_TIMEOUT_SECONDS; the heartbeat keeps live SSE streams honest.
    # Exactly one replica: a second beat double-publishes every periodic task.
    # No healthcheck: beat exposes no control queue to ping.
    image: nc3-testing-platform-worker-platform:local
    environment:
      <<: *worker-env
      # Beat only schedules and never opens a session, but it runs on the
      # platform image: keep its credential the platform one so it can never
      # silently become a tenant-role DB client.
      APP_DATABASE_URL: ${PLATFORM_DATABASE_URL:-postgresql+psycopg://app_platform:${NC3_PLATFORM_DB_PASSWORD:-app_platform}@postgres:5432/${POSTGRES_DB:-nc3_testing_platform}}
    command:
      - celery
      - -A
      - nc3_testing_platform.worker.app
      - beat
      - --loglevel=INFO
      # Last-run times outlive the container, so a restart does not re-fire every periodic task at once.
      - --schedule=/var/lib/celery/beat-schedule
    volumes:
      - beat-schedule:/var/lib/celery

volumes:
  beat-schedule:

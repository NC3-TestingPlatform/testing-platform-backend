services:
  api:
    image: nc3-testing-platform-api:local
    build:
      context: ../..
      target: api
    extends:
      file: common.yml
      service: defaults
    environment:
      # The mock handlers persist nothing yet; the URL is wired now so the ORM
      # work (issue #2) changes code, not the compose stack.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nc3_testing_platform}
      REDIS_URL: redis://redis:6379/0
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-http://localhost:8080/auth/v1/.well-known/openid-configuration}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The API image carries no curl; the interpreter it runs on probes its own liveness route.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

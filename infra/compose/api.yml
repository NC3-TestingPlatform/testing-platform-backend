services:
  api:
    image: nc3-testing-platform-api:local
    build:
      context: ../..
      target: api
    extends:
      file: common.yml
      service: defaults
    environment:
      # The mock handlers use none of these yet; they are wired now so the ORM
      # (issue #2) and scan-launch work change code, not the compose stack.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nc3_testing_platform}
      # Runtime role connection (docs/database-roles.md): the tenant role
      # `nc3_app`, which the workers read since B5. The API itself opens no
      # session until B3 wires its session dependency onto core/rls.py.
      # The password is interpolated raw: if it contains URL-reserved characters
      # (@ : / % ? #), set APP_DATABASE_URL directly with it percent-encoded.
      APP_DATABASE_URL: ${APP_DATABASE_URL:-postgresql+psycopg://nc3_app:${NC3_APP_DB_PASSWORD:-nc3_app}@postgres:5432/${POSTGRES_DB:-nc3_testing_platform}}
      # Credential-surface connection (B3, docs/database-roles.md): the api
      # service alone holds nc3_auth; no worker service gets this variable.
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:-postgresql+psycopg://nc3_auth:${NC3_AUTH_DB_PASSWORD:-nc3_auth}@postgres:5432/${POSTGRES_DB:-nc3_testing_platform}}
      # Envelope master key (data-model §1.2) — api only, never the workers.
      # Development value from .env; production mounts a secret file and sets
      # APP_ENCRYPTION_MASTER_KEY_FILE instead.
      APP_ENCRYPTION_MASTER_KEY: ${APP_ENCRYPTION_MASTER_KEY:-}
      AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:-}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-rabbitmq}:${RABBITMQ_PASSWORD:-rabbitmq}@rabbitmq:5672//
      REDIS_URL: redis://redis:6379/0
      # Service hostname, not localhost: the API reaches Rauthy over the
      # Compose network. Browsers still use the host-mapped localhost URL.
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-http://rauthy:8080/auth/v1/.well-known/openid-configuration}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The API image carries no curl; the interpreter it runs on probes its own liveness route.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

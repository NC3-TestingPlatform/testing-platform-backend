# Celery's remote-control (pidbox) queues — the channel behind `celery inspect`
# and the worker healthchecks — are declared transient and non-exclusive, which
# RabbitMQ 4.x deprecates and denies by default. Without this permit every
# worker consumer crash-loops on Queue.declare and `inspect ping` cannot run.
# Drop it when Celery declares its control queues within the allowed types.
deprecated_features.permit.transient_nonexcl_queues = true
